plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.rakshyaa.rakshyaa'
    compileSdk 34

    def backendProps = new Properties()
    def backendPropsFile = rootProject.file("backend.properties")
    if (backendPropsFile.exists()) {
        backendProps.load(new FileInputStream(backendPropsFile))
    }

    defaultConfig {
        applicationId "com.rakshyaa.rakshyaa"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }

        // Backend base URL the app talks to (e.g. http://10.0.2.2:8080 for emulator).
        buildConfigField "String", "BACKEND_BASE_URL",
            "\"${backendProps.getProperty("BACKEND_BASE_URL", "https://placeholder.invalid")}\""
        // Google OAuth "server client id" (web client id) used by Credential Manager.
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID",
            "\"${backendProps.getProperty("GOOGLE_WEB_CLIENT_ID", "placeholder-web-client-id")}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    // Workaround for Kotlin 2.0 + kapt + Hilt issue
    kapt {
        correctErrorTypes = true
    }
}

dependencies {
    // Core
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-compose:1.9.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.4"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // Compose
    implementation platform("androidx.compose:compose-bom:2024.08.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.animation:animation:1.6.8"
    implementation "androidx.compose.animation:animation-core:1.6.8"
    implementation "androidx.navigation:navigation-compose:2.7.7"

    // Hilt
    implementation "com.google.dagger:hilt-android:2.52"
    kapt "com.google.dagger:hilt-android-compiler:2.52"
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"

    // Google sign-in via Credential Manager (Google Identity Services)
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"

    // Networking
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // JSON parsing
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"

    // Session JWT parsing (backend-issued token)
    implementation "com.auth0:java-jwt:4.4.0"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // CameraX for video capture
    def camerax_version = "1.3.3"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // osmdroid for OpenStreetMap (Phase 2: Location Tracking)
    implementation "org.osmdroid:osmdroid-android:6.1.15"
    implementation "org.osmdroid:osmdroid-wms:6.1.15"

    // Testing
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    androidTestImplementation platform("androidx.compose:compose-bom:2024.08.00")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
